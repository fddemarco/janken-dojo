description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: ngram, space: {ORDER: 3, CTX: MY, OF: OPP, DECAY: 0.85}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: backoff, space: {MAX_ORDER: 2, CTX: OPP, OF: OPP}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 17, CTX: MY, OF: MY}, rotations: [BEAT, BEAT_BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.85}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
