        - {bot: frequency, space: {OF: MY, DECAY: 0.85}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: second_match, space: {MAX_LEN: 13, CTX: JOINT, OF: OPP}, rotations: [COPY, BEAT_BEAT]}
        - {bot: ctw, space: {DEPTH: 3, CTX: MY, OF: MY, DECAY: 0.9}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: frequency, space: {OF: OPP, DECAY: 0.9}, rotations: [COPY, BEAT]}
