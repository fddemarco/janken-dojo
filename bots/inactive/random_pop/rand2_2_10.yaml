description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: score_state, space: {OF: OPP, DECAY: 0.85}, rotations: [BEAT_BEAT, COPY]}
        - {bot: backoff, space: {MAX_ORDER: 3, CTX: OPP, OF: MY}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.95}, rotations: [COPY, BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.98}, rotations: [BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.9}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
