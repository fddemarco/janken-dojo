description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: second_match, space: {MAX_LEN: 16, CTX: OPP, OF: OPP}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 0, DECAY: 0.95}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 12, CTX: OPP, OF: OPP}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: frequency, space: {OF: OPP, DECAY: 0.85}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 8, SAMPLE: 1}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: ngram, space: {ORDER: 3, CTX: OPP, OF: OPP, DECAY: 0.98}, rotations: [BEAT_BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
