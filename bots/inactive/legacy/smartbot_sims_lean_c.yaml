description: |
  smartbot_sims_v2 keeping only 3 models of us (iocaine_lite, smartbot_v1, pattern_memory): a leaner V3 main, since added arms dilute it (research/probes.md, Field twins).
defaults:
  ARM_DECAY: 0.95
  TABLE_DECAY: 0.9
  MAX_MATCH: 12
blueprint:
  core:
    Bandit:
      predictors:
        # smartbot's 18 opponent models, each played 3 ways
        - {bot: frequency, arms: 2, space: {DECAY: [1.0, 0.9]}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - bot: ngram
          arms: 10
          space:
            ORDER: [1, 2, 3, 4, 1, 2, 3, 1, 2, 3]
            CTX: [OPP, OPP, OPP, OPP, JOINT, JOINT, JOINT, MY, MY, MY]
            DECAY: $TABLE_DECAY
          rotations: [COPY, BEAT, BEAT_BEAT]
        - bot: longest_match
          arms: 3
          space: {MAX_LEN: $MAX_MATCH, CTX: [OPP, JOINT, MY]}
          rotations: [COPY, BEAT, BEAT_BEAT]
        - bot: relative
          arms: 3
          space: {REF: [OPP, OPP, MY], BY_OUTCOME: [0, 1, 0], DECAY: $TABLE_DECAY}
          rotations: [COPY, BEAT, BEAT_BEAT]
        # 8 models of us: zoo bots played from the opponent's side
        - {bot: pattern_memory_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: iocaine_lite_v1, side: OPP, random_arm: RA_NONE, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: smartbot_v1, side: OPP, random_arm: RA_NONE, rotations: [BEAT, BEAT_BEAT, COPY]}
      scorer: {Dirichlet: {decay: $ARM_DECAY}}
      random_arm: RA_SCORED
      selector: Thompson
