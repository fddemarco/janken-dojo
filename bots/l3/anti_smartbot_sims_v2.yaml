description: |
  A specialist against smartbot_sims: replay it exactly, beat its likeliest move.

  v2 (2026-10-12): v1 over smartbot_sims_v2 (no word2janken sims); the figures
  below were measured on v1.

  One signal, a Replay of smartbot_sims's whole core at its constants (0.95, 0.9,
  12), its own replays of smartbot and smartbot_fast nested inside (they see the
  history swapped back). smartbot_sims picks its arm by Thompson sampling, so the
  replay doesn't name one arm: it runs 256 Thompson draws over the replayed arm
  records (draws: 256) and names the move picked most often; we play its beat.
  Against smartbot_sims this wins about 42% of rounds (seeds 1-40, 250 rounds), near
  the ~44% that smartbot_sims's own sampling allows. It has no other models, so
  against the rest of the field it is only as good as a replay of smartbot_sims is.
blueprint:
  core:
    Heuristic:
      signal: {bot: smartbot_sims_v2, side: OPP, draws: 256}
