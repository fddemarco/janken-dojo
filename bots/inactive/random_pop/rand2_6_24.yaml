        - {bot: ctw, space: {DEPTH: 2, CTX: OPP, OF: MY, DECAY: 0.98}, rotations: [COPY, BEAT_BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.8}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.85}, rotations: [COPY, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 20, CTX: JOINT, OF: OPP}, rotations: [COPY, BEAT_BEAT, BEAT]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
