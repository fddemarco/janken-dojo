description: |
  After a win, assume the opponent now beats our last move
  and beat that; otherwise beat the opponent's last move.
defaults:
  NOISE: 0.05
blueprint:
  guards:
    - Noise: {p: $NOISE}
    - Opening: {rounds: 1, move: ROCK}
    - OnInvalid: {action: CRASH_ACTION, scope: LAST, side: BOTH}
  signals: [React]
  rotations: [BEAT]
