description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: score_state, space: {OF: OPP, DECAY: 0.98}, rotations: [COPY, BEAT_BEAT]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 11, SAMPLE: 1}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 8, SAMPLE: 1}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 12, DECAY: 0.9}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: backoff, space: {MAX_ORDER: 2, CTX: MY, OF: OPP}, rotations: [COPY, BEAT]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
