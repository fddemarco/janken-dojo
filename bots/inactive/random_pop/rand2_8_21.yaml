description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: score_state, space: {OF: OPP, DECAY: 1.0}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: ngram, space: {ORDER: 2, CTX: MY, OF: OPP, DECAY: 0.98}, rotations: [COPY, BEAT]}
        - {bot: ctw, space: {DEPTH: 2, CTX: MY, OF: MY, DECAY: 0.95}, rotations: [COPY, BEAT_BEAT]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 17, SAMPLE: 1}, rotations: [BEAT, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 1.0}}
