description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 23, SAMPLE: 1}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 22, SAMPLE: 1}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: ngram, space: {ORDER: 1, CTX: OPP, OF: MY, DECAY: 0.85}, rotations: [COPY, BEAT]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 9, DECAY: 0.8}, rotations: [COPY, BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 20, CTX: JOINT, OF: OPP}, rotations: [BEAT_BEAT, BEAT]}
      scorer: {DecayedNet: {decay: 0.99}}
      selector: {Greedy: {ties: TIES_RANDOM}}
