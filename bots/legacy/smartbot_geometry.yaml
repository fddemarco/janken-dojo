description: |
  Smartbot plus one geometry arm.

  The arm samples from geometry's learned rotation of the longest-match feature
  (ALPHA is its learning rate) and competes in the bandit like any other.
defaults:
  ARM_DECAY: 0.95
  TABLE_DECAY: 0.9
  MAX_MATCH: 12
  ALPHA: 0.05
blueprint:
  signals:
    - metabot_signals: {table_decay: $TABLE_DECAY, max_match: $MAX_MATCH}
    - Rotated:
        signal:
          Geometry: {alpha: $ALPHA, max_len: $MAX_MATCH}
        rotations: [BEAT]
  rotations: ALL_ROTATIONS
  scorer:
    Dirichlet: {decay: $ARM_DECAY}
  random_arm: RA_SCORED
  selector: Thompson
