description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: longest_match, space: {MAX_LEN: 4, CTX: MY, OF: MY}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: backoff, space: {MAX_ORDER: 2, CTX: MY, OF: OPP}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.95}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 8, CTX: JOINT, OF: OPP}, rotations: [BEAT_BEAT, COPY]}
        - {bot: longest_match, space: {MAX_LEN: 13, CTX: JOINT, OF: OPP}, rotations: [BEAT_BEAT, BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
