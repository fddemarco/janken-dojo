description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: longest_match, space: {MAX_LEN: 6, CTX: JOINT, OF: OPP}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.9}, rotations: [BEAT, COPY]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.98}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: ctw, space: {DEPTH: 2, CTX: MY, OF: MY, DECAY: 0.9}, rotations: [BEAT, COPY, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
