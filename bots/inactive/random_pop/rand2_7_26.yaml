description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: ngram, space: {ORDER: 3, CTX: MY, OF: OPP, DECAY: 0.95}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 11, SAMPLE: 1}, rotations: [BEAT, COPY]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.95}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.95}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: ngram, space: {ORDER: 3, CTX: MY, OF: MY, DECAY: 0.85}, rotations: [BEAT, COPY, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.9}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
