description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: backoff, space: {MAX_ORDER: 3, CTX: MY, OF: OPP}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: ngram, space: {ORDER: 2, CTX: OPP, OF: MY, DECAY: 1.0}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: backoff, space: {MAX_ORDER: 2, CTX: JOINT, OF: OPP}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: geometry, space: {ALPHA: 0.1, MAX_LEN: 24, SAMPLE: 1}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.9}, rotations: [COPY, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.85}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
