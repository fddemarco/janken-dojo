description: |
  Learns the opponent's order-1 transitions (decayed counts),
  samples their next move from the row for their last move, and beats it.
defaults:
  DECAY: 0.95
blueprint:
  guards:
    - {OnInvalid: {action: CRASH_ACTION, scope: ANY, side: OPP}}
    - {Opening: {rounds: 2, move: RANDOM_MOVE}}
  core:
    Bandit:
      predictors: [{NGram: {order: 1, ctx: OPP, decay: $DECAY, sample: true}}]
      rotations: [BEAT]
