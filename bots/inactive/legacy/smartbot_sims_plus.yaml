description: |
  smartbot_sims_v2 plus what the lab learned since: the strong L1 learners (context_mixture_v2: CTW decayed 0.81; pretrained_context_v3: the 4-move pre-trained table; second_repeat_v1) as opponent models played 3 ways, and those three plus repeat_mirror_v1 (the best L2) as models of us, replayed from the opponent's seat.
  The main of the V3 fleet core, upgraded (research/probes.md: the strong tournament bots are this family).
defaults:
  ARM_DECAY: 0.95
  TABLE_DECAY: 0.9
  MAX_MATCH: 12
blueprint:
  core:
    Bandit:
      predictors:
        # smartbot's 18 opponent models, each played 3 ways
        - {bot: frequency, arms: 2, space: {DECAY: [1.0, 0.9]}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - bot: ngram
          arms: 10
          space:
            ORDER: [1, 2, 3, 4, 1, 2, 3, 1, 2, 3]
            CTX: [OPP, OPP, OPP, OPP, JOINT, JOINT, JOINT, MY, MY, MY]
            DECAY: $TABLE_DECAY
          rotations: [COPY, BEAT, BEAT_BEAT]
        - bot: longest_match
          arms: 3
          space: {MAX_LEN: $MAX_MATCH, CTX: [OPP, JOINT, MY]}
          rotations: [COPY, BEAT, BEAT_BEAT]
        - bot: relative
          arms: 3
          space: {REF: [OPP, OPP, MY], BY_OUTCOME: [0, 1, 0], DECAY: $TABLE_DECAY}
          rotations: [COPY, BEAT, BEAT_BEAT]
        # the strong L1 learners found since (CTW decayed 0.81, the 4-move pre-trained table, the second repeat)
        - {bot: context_mixture_v2, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: pretrained_context_v3, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: second_repeat_v1, rotations: [COPY, BEAT, BEAT_BEAT]}
        # 12 models of us: zoo bots, and the strong L1-L2 learners, played from the opponent's side
        - {bot: context_mixture_v2, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: pretrained_context_v3, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: second_repeat_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: repeat_mirror_v1, side: OPP, draws: 0, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: pattern_memory_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: markov2_joint_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: iocaine_lite_v1, side: OPP, random_arm: RA_NONE, rotations: [BEAT, BEAT_BEAT, COPY]}
        - bot: ngram  # transition_matrix, its most likely move
          side: OPP
          space: {ORDER: 1, CTX: OPP, DECAY: 0.95}
          rotations: [BEAT, BEAT_BEAT, COPY]
        - {bot: rps4_lite_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - bot: geometry  # geometry, its most likely move
          side: OPP
          space: {ALPHA: 0.05, MAX_LEN: 20, SAMPLE: 0}
          rotations: [BEAT, BEAT_BEAT, COPY]
        - {bot: smartbot_v1, side: OPP, random_arm: RA_NONE, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: smartbot_fast_v1, side: OPP, random_arm: RA_NONE, rotations: [BEAT, BEAT_BEAT, COPY]}
      scorer: {Dirichlet: {decay: $ARM_DECAY}}
      random_arm: RA_SCORED
      selector: Thompson
