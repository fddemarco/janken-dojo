description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: ngram, space: {ORDER: 2, CTX: JOINT, OF: MY, DECAY: 0.9}, rotations: [BEAT_BEAT, COPY]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.8}, rotations: [COPY, BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 15, CTX: JOINT, OF: OPP}, rotations: [COPY, BEAT_BEAT, BEAT]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
