description: |
  replay_hunter_gate, plus replays of four more learners and of rps4_lite in our seat.

  As replay_hunter_gate_v1 (smartbot_sims_v2's main bandit; smartbot_sims_v2
  replayed from both seats; eight learners replayed from their seat), plus
  mirror_bandit, dropswitch_matcher and smartbot_wide replayed from their seat,
  and rps4_lite replayed from ours (anti_rps4 plays its beat: BEAT_BEAT beats
  that). Every replay is played all three ways, under a LEADER gatekeeper.
defaults:
  EDGE: 0.0
  GATE_DECAY: 1.0
  WARMUP: 10
blueprint:
  core:
    Gate:
      main: {bot: smartbot_sims_v2}
      experts:
        - {bot: smartbot_sims_v2, side: OPP, draws: 256, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: smartbot_sims_v2, side: MY, draws: 256, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: sampled_markov_v1, side: OPP, draws: 256, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: backoff_family_v1, side: OPP, draws: 256, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: smartbot_fast_v1, side: OPP, draws: 256, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: period_bandit_v1, side: OPP, draws: 256, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: l2_council_v1, side: OPP, draws: 256, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: counter_council_v1, side: OPP, draws: 256, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: dropswitch_council_v1, side: OPP, draws: 0, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: vote_council_v1, side: OPP, draws: 0, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: mirror_bandit_v1, side: OPP, draws: 256, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: dropswitch_matcher_v1, side: OPP, draws: 0, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: smartbot_wide_v1, side: OPP, draws: 256, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: rps4_lite_v1, side: MY, draws: 0, rotations: [COPY, BEAT, BEAT_BEAT]}
      rule: LEADER
      edge: $EDGE
      decay: $GATE_DECAY
      warmup: $WARMUP
