description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 11, DECAY: 0.95}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: period, space: {OF: MY, MAX_PERIOD: 13, DECAY: 0.98}, rotations: [COPY, BEAT, BEAT_BEAT]}
