[project]
name = "janken-bot-competition"
version = "0.1.0"
description = "Rock-paper-scissors bot tournament with Glicko-2 ratings and numba-accelerated bot ports."
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.5.6",
    "mdformat>=1.0.0",
    # Bots and the match engine are compiled with numba (janken/engine/, janken/kit/).
    "numba>=0.68.0",
    "numpy",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pre-commit>=4.6.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    # Bot files (bots/<level>/*.yaml) and space files (spaces/*.yaml).
    "pyyaml>=6.0",
    "ruff>=0.17.0",
    "tqdm>=4.70.1",
    "ty>=0.0.86",
    "typer>=0.27.3",
]

[project.scripts]
# `uv sync` installs the project (editable) with this console script: `janken ...` in
# the activated env, or `uv run janken ...` anywhere.
janken = "janken.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout for now (src/ is the target, migrated as its own change). The install must
# stay editable: janken/settings.py finds janken.toml, bots/ and experiments/ from
# its own __file__, i.e. in the repo.
module-name = "janken"
module-root = ""

[tool.ruff.lint.flake8-bugbear]
# janken/settings.py declares each setting with `setting(...)`, a dataclasses.field.
# The blueprint's stages are frozen dataclasses, so their defaults can be instances.
extend-immutable-calls = [
    "janken.settings.setting",
    "janken.kit.blueprint.scorers.NoScore",
    "janken.kit.blueprint.selectors.First",
    "janken.kit.blueprint.composites.Bandit",
]

[tool.pytest.ini_options]
# `uv run pytest`: tests/conftest.py switches the JIT off before any test module loads.
testpaths = ["tests"]
