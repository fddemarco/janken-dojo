description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: longest_match, space: {MAX_LEN: 5, CTX: OPP, OF: OPP}, rotations: [COPY, BEAT_BEAT, BEAT]}
