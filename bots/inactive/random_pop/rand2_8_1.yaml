description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: ngram, space: {ORDER: 3, CTX: MY, OF: MY, DECAY: 1.0}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: second_match, space: {MAX_LEN: 15, CTX: MY, OF: OPP}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 7, CTX: OPP, OF: OPP}, rotations: [BEAT_BEAT, COPY]}
        - {bot: frequency, space: {OF: OPP, DECAY: 0.98}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: second_match, space: {MAX_LEN: 4, CTX: MY, OF: OPP}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.98}, rotations: [BEAT_BEAT, BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.85}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
