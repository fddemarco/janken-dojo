description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: score_state, space: {OF: MY, DECAY: 0.98}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: ctw, space: {DEPTH: 3, CTX: MY, OF: OPP, DECAY: 0.85}, rotations: [COPY, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 9, CTX: JOINT, OF: MY}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 4, CTX: OPP, OF: OPP}, rotations: [COPY, BEAT, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.85}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
