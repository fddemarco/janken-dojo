description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: geometry, space: {ALPHA: 0.1, MAX_LEN: 17, SAMPLE: 1}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: ngram, space: {ORDER: 3, CTX: MY, OF: OPP, DECAY: 0.9}, rotations: [BEAT, COPY]}
        - {bot: rarest, space: {OF: MY, DECAY: 0.95}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 1, DECAY: 0.9}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.95}, rotations: [BEAT, COPY, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.85}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
