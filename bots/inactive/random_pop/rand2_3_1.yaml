description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: backoff, space: {MAX_ORDER: 3, CTX: JOINT, OF: OPP}, rotations: [BEAT_BEAT, COPY]}
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 26, SAMPLE: 1}, rotations: [BEAT, COPY]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 28, SAMPLE: 1}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: ngram, space: {ORDER: 2, CTX: OPP, OF: OPP, DECAY: 0.95}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: ngram, space: {ORDER: 1, CTX: JOINT, OF: OPP, DECAY: 0.9}, rotations: [BEAT_BEAT, BEAT, COPY]}
      scorer: {DecayedNet: {decay: 0.9}}
      selector: {Greedy: {ties: TIES_RANDOM}}
