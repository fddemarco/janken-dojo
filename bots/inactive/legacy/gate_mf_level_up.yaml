description: |
  The V3 fleet core's gate (gate_main_first_v3: the main first, smartbot_sims replayed from their seat once its record leads) over sims_level_up as its main.
  Hypothesis: as sims_level_up, judged on the field-twin bench (research/gauntlet/twins_*.txt).
defaults:
  EDGE: 0.0
  GATE_DECAY: 1.0
  WARMUP: 10
blueprint:
  core:
    Gate:
      main: {bot: sims_level_up}
      experts:
        - {bot: smartbot_sims_v2, side: OPP, estimate: NORMAL, rotations: [BEAT]}
      rule: MAIN_FIRST
      edge: $EDGE
      decay: $GATE_DECAY
      warmup: $WARMUP
