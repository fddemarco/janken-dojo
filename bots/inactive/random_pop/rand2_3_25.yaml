description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: score_state, space: {OF: OPP, DECAY: 0.9}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 15, DECAY: 0.85}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 20, SAMPLE: 1}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 13, CTX: JOINT, OF: OPP}, rotations: [BEAT_BEAT, BEAT, COPY]}
      scorer: {DecayedNet: {decay: 0.99}}
      selector: {Greedy: {ties: TIES_RANDOM}}
