description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: second_match, space: {MAX_LEN: 14, CTX: JOINT, OF: MY}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 15, SAMPLE: 1}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: frequency, space: {OF: OPP, DECAY: 0.9}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: ngram, space: {ORDER: 1, CTX: JOINT, OF: OPP, DECAY: 1.0}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.85}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.95}, rotations: [BEAT, COPY]}
      scorer: {DecayedNet: {decay: 0.9}}
      selector: {Greedy: {ties: TIES_RANDOM}}
