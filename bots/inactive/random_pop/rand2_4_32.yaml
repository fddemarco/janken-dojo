description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: rarest, space: {OF: OPP, DECAY: 0.95}, rotations: [BEAT_BEAT, COPY]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 14, DECAY: 0.8}, rotations: [COPY, BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 20, CTX: MY, OF: MY}, rotations: [BEAT, COPY]}
        - {bot: ngram, space: {ORDER: 2, CTX: JOINT, OF: MY, DECAY: 0.98}, rotations: [BEAT, COPY]}
        - {bot: frequency, space: {OF: OPP, DECAY: 0.95}, rotations: [BEAT_BEAT, COPY, BEAT]}
      scorer: {DecayedNet: {decay: 0.8}}
      selector: {Greedy: {ties: TIES_RANDOM}}
