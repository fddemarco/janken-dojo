description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: score_state, space: {OF: OPP, DECAY: 0.95}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: longest_match, space: {MAX_LEN: 15, CTX: JOINT, OF: OPP}, rotations: [BEAT_BEAT, COPY]}
        - {bot: second_match, space: {MAX_LEN: 7, CTX: MY, OF: OPP}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.8}, rotations: [BEAT, BEAT_BEAT, COPY]}
      scorer: {DecayedNet: {decay: 0.9}}
      selector: {Greedy: {ties: TIES_RANDOM}}
