description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: longest_match, space: {MAX_LEN: 5, CTX: MY, OF: MY}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: rarest, space: {OF: OPP, DECAY: 0.98}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.85}, rotations: [COPY, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 18, CTX: MY, OF: OPP}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: period, space: {OF: MY, MAX_PERIOD: 7, DECAY: 0.98}, rotations: [BEAT_BEAT, COPY]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.95}, rotations: [BEAT_BEAT, COPY]}
      scorer: {DecayedNet: {decay: 0.8}}
      selector: {Greedy: {ties: TIES_RANDOM}}
