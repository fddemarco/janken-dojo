description: |
  l5_hunter plus parameter-variant replays of the species where identifying the opponent pays (idea #51).
  As l5_hunter, with 8 Latin-hypercube variants each (their core parameters, drawn from their space files) of rps4_lite, outcome_reader, iocaine_lite and period_bandit replayed from their seat and beaten, as gated experts under the same LEADER gate: the kit form of janken lab identify's switch branch (+12.3 pts over l5_hunter after round 150 vs these species' variants, no loss vs held-out species).
defaults:
  EDGE: 0.0
  GATE_DECAY: 1.0
  WARMUP: 10
blueprint:
  core:
    Gate:
      main: {bot: smartbot_sims_v2}
      experts:
        - {bot: smartbot_sims_v2, side: OPP, estimate: NORMAL, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: smartbot_sims_v2, side: MY, estimate: NORMAL, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: sampled_markov_v1, side: OPP, estimate: NORMAL, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: backoff_family_v1, side: OPP, estimate: NORMAL, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: smartbot_fast_v1, side: OPP, estimate: NORMAL, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: period_bandit_v1, side: OPP, estimate: NORMAL, rotations: [BEAT, BEAT_BEAT, COPY]}
