description: |
  Research-only: gate_anti_first (the ANTI_FIRST gatekeeper) with its anti expert as a per-level Oracle arm.

  smartbot_sims's arms plus, as the gated last arm, an Oracle that wins like
  anti_smartbot_sims vs each opponent level (0.3367 / 0.4059 / 0.415 / 0.3681,
  `janken lab calibrate anti_smartbot_sims`, 2026-10-11), so the gatekeeper sees
  the anti expert's evidence without its 256-draw replay. A research candidate,
  never drawn into a pool; it cheats: never in a tournament or an export.
defaults:
  EDGE: 0.05
  GATE_DECAY: 1.0
  WARMUP: 10
blueprint:
  signals:
    - {metabot_signals: {table_decay: 0.9, max_match: 12}}
    - {sims: [10]}
    - Rotated:
        signal: {Oracle: {wins: [0.3367, 0.4059, 0.415, 0.3681]}}
        rotations: [BEAT]
  rotations: ALL_ROTATIONS
  scorer: {Dirichlet: {decay: 0.95}}
  random_arm: RA_SCORED
  selector: {Gatekeeper: {edge: $EDGE, decay: $GATE_DECAY, warmup: $WARMUP, rule: ANTI_FIRST}}
