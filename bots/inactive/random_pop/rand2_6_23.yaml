description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: second_match, space: {MAX_LEN: 8, CTX: JOINT, OF: OPP}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: ngram, space: {ORDER: 2, CTX: JOINT, OF: OPP, DECAY: 1.0}, rotations: [BEAT_BEAT, COPY]}
        - {bot: frequency, space: {OF: OPP, DECAY: 0.98}, rotations: [COPY, BEAT_BEAT]}
        - {bot: ctw, space: {DEPTH: 2, CTX: OPP, OF: OPP, DECAY: 0.98}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: longest_match, space: {MAX_LEN: 10, CTX: OPP, OF: OPP}, rotations: [BEAT, COPY]}
      scorer: {DecayedNet: {decay: 0.9}}
      selector: {Greedy: {ties: TIES_RANDOM}}
