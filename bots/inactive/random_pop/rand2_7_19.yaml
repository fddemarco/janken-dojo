description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: score_state, space: {OF: OPP, DECAY: 0.9}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.98}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 4, DECAY: 1.0}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 15, CTX: MY, OF: MY}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 11, DECAY: 1.0}, rotations: [COPY, BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.85}, rotations: [COPY, BEAT_BEAT]}
      scorer: {DecayedNet: {decay: 0.95}}
      selector: {Greedy: {ties: TIES_RANDOM}}
