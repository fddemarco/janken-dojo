description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: ctw, space: {DEPTH: 1, CTX: OPP, OF: OPP, DECAY: 1.0}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: longest_match, space: {MAX_LEN: 19, CTX: MY, OF: OPP}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 27, SAMPLE: 1}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: ngram, space: {ORDER: 1, CTX: JOINT, OF: OPP, DECAY: 0.98}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 8, DECAY: 0.9}, rotations: [BEAT, COPY, BEAT_BEAT]}
      scorer: {DecayedNet: {decay: 0.8}}
      selector: {Greedy: {ties: TIES_RANDOM}}
