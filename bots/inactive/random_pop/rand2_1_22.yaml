description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: rarest, space: {OF: MY, DECAY: 0.95}, rotations: [COPY, BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 11, CTX: OPP, OF: MY}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 8, SAMPLE: 1}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.95}, rotations: [BEAT_BEAT, COPY]}
        - {bot: rarest, space: {OF: MY, DECAY: 0.85}, rotations: [BEAT_BEAT, BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 1.0}}
