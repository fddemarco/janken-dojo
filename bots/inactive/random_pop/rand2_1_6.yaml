description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: second_match, space: {MAX_LEN: 15, CTX: OPP, OF: MY}, rotations: [COPY, BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.95}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 1, DECAY: 0.85}, rotations: [BEAT_BEAT, COPY, BEAT]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 1.0}}
