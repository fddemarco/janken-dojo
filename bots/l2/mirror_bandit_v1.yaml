description: |
  Models of us: what each learning zoo bot would play against us, countered.

  Every arm is a learning L1 of the field played from the opponent's side
  (frequency, markov2_joint, pattern_memory, transition_matrix's most likely move,
  word2janken, rotation_outcome, balancer_hunter, period_detector, score_reader),
  three rotations each: we beat the opponent if it models us like that bot, or
  if it models our model. Dirichlet scores, Thompson sampling at SHARP.
defaults:
  ARM_DECAY: 0.9
  SHARP: 1.0
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: frequency_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: markov2_joint_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: pattern_memory_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - bot: ngram  # transition_matrix, its most likely move
          side: OPP
          space: {ORDER: 1, CTX: OPP, DECAY: 0.95}
          rotations: [BEAT, BEAT_BEAT, COPY]
        - {bot: word2janken_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: rotation_outcome_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: balancer_hunter_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: period_detector_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: score_reader_v1, side: OPP, rotations: [BEAT, BEAT_BEAT, COPY]}
      scorer: {Dirichlet: {decay: $ARM_DECAY}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: $SHARP}}
