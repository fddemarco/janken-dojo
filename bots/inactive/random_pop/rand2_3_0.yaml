description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 28, SAMPLE: 1}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: backoff, space: {MAX_ORDER: 2, CTX: OPP, OF: MY}, rotations: [COPY, BEAT_BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.85}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.95}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: rarest, space: {OF: OPP, DECAY: 1.0}, rotations: [COPY, BEAT]}
        - {bot: ngram, space: {ORDER: 2, CTX: MY, OF: MY, DECAY: 0.98}, rotations: [BEAT, COPY, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
