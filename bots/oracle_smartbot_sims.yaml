description: |
  Research-only pure Oracle of smartbot_sims (L3): its win chance per opponent level, no game logic.

  The referee never runs this bot: each round it draws an outcome vs the opponent's
  move with smartbot_sims's measured win chance vs the opponent's level (ties and losses
  split the rest; `janken lab calibrate smartbot_sims`, 16 seeds, 2026-10-11), and draws
  vs another Oracle. Pools use it in place of smartbot_sims with `pool.mocks`. It cheats:
  never in a tournament or an export.
mocks: smartbot_sims
defaults:
  WIN_L1: 0.702
  WIN_L2: 0.5108
  WIN_L3: 0.2769
  WIN_L4: 0.2841
blueprint:
  signals:
    - Oracle: {wins: [$WIN_L1, $WIN_L2, $WIN_L3, $WIN_L4]}
