description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.95}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: frequency, space: {OF: OPP, DECAY: 1.0}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.98}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 30, SAMPLE: 1}, rotations: [BEAT_BEAT, BEAT]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 1.0}}
