description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: longest_match, space: {MAX_LEN: 11, CTX: MY, OF: OPP}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 18, CTX: JOINT, OF: OPP}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.85}, rotations: [BEAT_BEAT, BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.9}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
