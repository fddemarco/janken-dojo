description: |
  gate_main_first_v3 (the V3 core with the computed replay estimate) over smartbot_sims_readers: stronger opponent models in V3's main, judged on the field-twin bench.
defaults:
  EDGE: 0.0
  GATE_DECAY: 1.0
  WARMUP: 10
blueprint:
  core:
    Gate:
      main: {bot: smartbot_sims_readers}
      experts:
        - {bot: smartbot_sims_readers, side: OPP, estimate: NORMAL, rotations: [BEAT]}
      rule: MAIN_FIRST
      edge: $EDGE
      decay: $GATE_DECAY
      warmup: $WARMUP
