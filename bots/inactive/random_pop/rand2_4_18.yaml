description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: longest_match, space: {MAX_LEN: 8, CTX: OPP, OF: MY}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: period, space: {OF: MY, MAX_PERIOD: 16, DECAY: 0.98}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.8}, rotations: [BEAT, COPY]}
        - {bot: longest_match, space: {MAX_LEN: 4, CTX: OPP, OF: OPP}, rotations: [COPY, BEAT_BEAT]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 29, SAMPLE: 1}, rotations: [BEAT, COPY]}
      scorer: {DecayedNet: {decay: 0.95}}
      selector: {Greedy: {ties: TIES_RANDOM}}
