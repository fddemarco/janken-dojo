description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: ctw, space: {DEPTH: 1, CTX: MY, OF: OPP, DECAY: 0.8}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: frequency, space: {OF: MY, DECAY: 0.95}, rotations: [BEAT_BEAT, COPY]}
        - {bot: ngram, space: {ORDER: 3, CTX: JOINT, OF: MY, DECAY: 0.95}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: ctw, space: {DEPTH: 1, CTX: JOINT, OF: MY, DECAY: 0.85}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 11, CTX: JOINT, OF: OPP}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 8, CTX: OPP, OF: MY}, rotations: [BEAT, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
