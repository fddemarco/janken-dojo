description: |
  A Markov bandit and three pattern experts, under a LEADER gatekeeper.

  The main bandit Thompson-samples n-grams (orders 1-3 of the opponent's and the
  joint history, three rotations each). The gated experts are a longest-match,
  Superant's geometry (its most likely move) and a back-off predictor, each played
  BEAT. The gatekeeper keeps every expert's record and hands play to whichever
  leads the current one by more than EDGE (from round WARMUP on).
defaults:
  ARM_DECAY: 0.95
  EDGE: 0.05
  WARMUP: 20
blueprint:
  core:
    Gate:
      main:
        Bandit:
          predictors:
            - bot: ngram
              arms: 6
              space: {ORDER: [1, 2, 3, 1, 2, 3], CTX: [OPP, OPP, OPP, JOINT, JOINT, JOINT], DECAY: 0.9}
              rotations: [COPY, BEAT, BEAT_BEAT]
          scorer: {Dirichlet: {decay: $ARM_DECAY}}
          random_arm: RA_SCORED
          selector: Thompson
      experts:
        - {bot: longest_match, space: {MAX_LEN: 12, CTX: JOINT}}
        - {bot: geometry, space: {SAMPLE: 0}}
        - {bot: backoff, space: {MAX_ORDER: 3, CTX: JOINT}}
      rule: LEADER
      edge: $EDGE
      warmup: $WARMUP
