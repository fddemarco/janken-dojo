description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: frequency, space: {OF: OPP, DECAY: 0.8}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: rarest, space: {OF: OPP, DECAY: 0.98}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 15, DECAY: 0.9}, rotations: [COPY, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 4, CTX: OPP, OF: MY}, rotations: [COPY, BEAT]}
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 1, DECAY: 0.98}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.98}, rotations: [BEAT, COPY, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
