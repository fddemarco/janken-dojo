description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: ngram, space: {ORDER: 2, CTX: MY, OF: MY, DECAY: 0.8}, rotations: [COPY, BEAT_BEAT]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 12, DECAY: 1.0}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: ctw, space: {DEPTH: 2, CTX: MY, OF: OPP, DECAY: 0.9}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 1.0}, rotations: [BEAT_BEAT, COPY]}
        - {bot: rarest, space: {OF: OPP, DECAY: 0.8}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 10, CTX: JOINT, OF: OPP}, rotations: [COPY, BEAT]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
