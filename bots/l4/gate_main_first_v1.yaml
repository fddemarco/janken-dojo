description: |
  The MAIN_FIRST gatekeeper: smartbot_sims's arms first, the anti expert once it leads.

  smartbot_sims's arms (L3) plus anti_smartbot_sims' Replay of smartbot_sims (256
  Thompson draws, played BEAT) as the gated last arm: an L4. Its Gatekeeper starts
  on the advanced arms and, from round WARMUP on, moves to the anti expert as soon
  as the anti expert's counterfactual record leads theirs (EDGE 0), keeping it
  until the advanced arms lead by EDGE (hysteresis). Built for the level targets:
  as good as the best L2 vs L1 (it plays like smartbot_sims there) and better than
  the best L3 vs L2 (it switches to the anti expert vs the metabots). Screened with
  an Oracle arm vs ANTI_FIRST, ANTI_FIRST_HOLD, BANDIT and EDGE (32 paired seeds).
defaults:
  EDGE: 0.0
  GATE_DECAY: 1.0
  WARMUP: 10
blueprint:
  core:
    Gate:
      main:
        Bandit:
          predictors:
            - {metabot_signals: {table_decay: 0.9, max_match: 12}}
            - {sims: [10]}
          rotations: ALL_ROTATIONS
          scorer: {Dirichlet: {decay: 0.95}}
          random_arm: RA_SCORED
          selector: Thompson
      experts:
        - Rotated:
            signal:
              Replay:
                bandit:
                  smartbot_sims:
                    n: 10
                    arm_decay: 0.95
                    table_decay: 0.9
                    max_match: 12
                draws: 256
            rotations: [BEAT]
      rule: MAIN_FIRST
      edge: $EDGE
      decay: $GATE_DECAY
      warmup: $WARMUP
