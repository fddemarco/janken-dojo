description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 4, DECAY: 0.95}, rotations: [COPY, BEAT]}
        - {bot: ngram, space: {ORDER: 1, CTX: MY, OF: OPP, DECAY: 0.85}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.98}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: ctw, space: {DEPTH: 2, CTX: JOINT, OF: OPP, DECAY: 0.9}, rotations: [BEAT, BEAT_BEAT]}
      scorer: {DecayedNet: {decay: 0.9}}
      selector: {Greedy: {ties: TIES_RANDOM}}
