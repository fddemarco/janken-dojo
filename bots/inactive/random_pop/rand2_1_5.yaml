description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 0, DECAY: 0.9}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.98}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: frequency, space: {OF: MY, DECAY: 0.85}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: geometry, space: {ALPHA: 0.1, MAX_LEN: 19, SAMPLE: 1}, rotations: [BEAT, COPY, BEAT_BEAT]}
      scorer: {DecayedNet: {decay: 0.9}}
      selector: {Greedy: {ties: TIES_RANDOM}}
