description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: geometry, space: {ALPHA: 0.1, MAX_LEN: 14, SAMPLE: 1}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.95}, rotations: [BEAT, COPY]}
        - {bot: backoff, space: {MAX_ORDER: 2, CTX: MY, OF: MY}, rotations: [COPY, BEAT, BEAT_BEAT]}
      scorer: {DecayedNet: {decay: 0.95}}
      selector: {Greedy: {ties: TIES_RANDOM}}
