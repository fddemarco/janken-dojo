description: |
  Probe (research only, never in the field): A De Bruijn sequence of order 4 (81 moves, every 4 moves in a row once), repeated: separates bots that look up to 3 moves back (about 0) from those that find long repeats on our moves alone (+190 to +240).
  It ignores the opponent; its final scores vs each bot are a fingerprint of that bot (research/probes.md).
defaults: {}
blueprint:
  core:
    Heuristic:
      # moves: 0 rock, 1 paper, 2 scissors
      signal:
        Script:
          moves: [
          0, 0, 0, 0, 1, 0, 0, 0, 2, 0, 0, 1, 1, 0, 0, 1, 2, 0, 0, 2, 1, 0, 0, 2, 2, 0, 1, 0, 1, 0,
          2, 0, 1, 1, 1, 0, 1, 1, 2, 0, 1, 2, 1, 0, 1, 2, 2, 0, 2, 0, 2, 1, 1, 0, 2, 1, 2, 0, 2, 2,
          1, 0, 2, 2, 2, 1, 1, 1, 1, 2, 1, 1, 2, 2, 1, 2, 1, 2, 2, 2, 2
          ]
      rotation: COPY
