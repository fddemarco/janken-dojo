description: |
  Finds which prey it faces: the anti-metabot specialists and the zoo hunter.

  Arms are the L2 specialists anti_smartbot, anti_iocaine and anti_rps4 (each a
  replay of its target, beaten) and zoo_hunter (which simple L1 the opponent is),
  each played three ways. Decayed net scores, greedy: once one specialist's
  target is identified it plays that specialist.
defaults:
  DECAY: 0.9
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: anti_smartbot_v1, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: anti_iocaine_v1, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: anti_rps4_v1, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: zoo_hunter_v1, rotations: [COPY, BEAT, BEAT_BEAT]}
      scorer: {DecayedNet: {decay: $DECAY}}
      random_arm: RA_PINNED
      selector: {Greedy: {ties: TIES_RANDOM}}
