description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 13, SAMPLE: 1}, rotations: [BEAT_BEAT, COPY]}
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 19, SAMPLE: 1}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: frequency, space: {OF: OPP, DECAY: 1.0}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 19, SAMPLE: 1}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.8}, rotations: [BEAT, COPY, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.85}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
