description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 1, DECAY: 0.98}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.85}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.95}, rotations: [COPY, BEAT_BEAT, BEAT]}
      scorer: {DecayedNet: {decay: 0.99}}
      selector: {Greedy: {ties: TIES_RANDOM}}
