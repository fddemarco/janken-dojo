description: |
  smartbot_sims posing as an Iliad fleet support (idea #25).

  Opens with the fleet's 8-move handshake and a support's role move (Team role
  IMPOSTOR, janken/kit/overlays.py). The champion, agamemnon, takes it for a
  support and plays PAPER from then on, expecting a thrown ROCK; smartbot_sims_impostor plays
  SCISSORS. Against anyone else the handshake breaks within a move or two and it
  plays smartbot_sims.
defaults:
  ARM_DECAY: 0.95
  TABLE_DECAY: 0.9
  MAX_MATCH: 12
blueprint:
  core:
    bot: smartbot_sims_v1
    space: {ARM_DECAY: $ARM_DECAY, TABLE_DECAY: $TABLE_DECAY, MAX_MATCH: $MAX_MATCH}
  overlays: [{Team: {role: IMPOSTOR}}]
