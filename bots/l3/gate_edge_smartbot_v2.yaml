description: |
  smartbot, with its own replay as an EDGE-gated expert (NORMAL replays).
  As gate_edge_smartbot_v1, its replays naming their move by estimate NORMAL instead of 256 Thompson draws: the same likely move, computed, about 10x cheaper (idea #50).
defaults:
  EDGE: 0.06
  WARMUP: 20
blueprint:
  core:
    Gate:
      main: {bot: smartbot_v1}
      experts:
        - {bot: smartbot_v1, side: OPP, estimate: NORMAL, rotations: [BEAT]}
      rule: EDGE
      edge: $EDGE
      warmup: $WARMUP
