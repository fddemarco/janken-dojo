description: |
  smartbot_sims plus second-order history matching (idea #5).

  Three SecondMatch signals (opponent, joint and our history, at MAX_MATCH): for the
  longest earlier repeat of the history's suffix, they look up that matched point's
  own earlier repeat and predict what followed it, an older witness of the same
  pattern (rps_kaggle §4.2, Testing Please Ignore). Each gets the three rotations
  and joins smartbot_sims's arms under the same Dirichlet scores and Thompson
  sampling.
defaults:
  ARM_DECAY: 0.95
  TABLE_DECAY: 0.9
  MAX_MATCH: 12
blueprint:
  core:
    Bandit:
      predictors:
        - {metabot_signals: {table_decay: $TABLE_DECAY, max_match: $MAX_MATCH}}
        - {sims: {n: 10}}
        - {SecondMatch: {max_len: $MAX_MATCH, ctx: OPP}}
        - {SecondMatch: {max_len: $MAX_MATCH, ctx: JOINT}}
        - {SecondMatch: {max_len: $MAX_MATCH, ctx: MY}}
      rotations: ALL_ROTATIONS
      scorer: {Dirichlet: {decay: $ARM_DECAY}}
      random_arm: RA_SCORED
      selector: Thompson
