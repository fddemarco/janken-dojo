description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 0, DECAY: 0.9}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: second_match, space: {MAX_LEN: 13, CTX: MY, OF: OPP}, rotations: [COPY, BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.8}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: frequency, space: {OF: OPP, DECAY: 0.9}, rotations: [BEAT_BEAT, COPY]}
        - {bot: second_match, space: {MAX_LEN: 11, CTX: OPP, OF: OPP}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: backoff, space: {MAX_ORDER: 3, CTX: JOINT, OF: OPP}, rotations: [BEAT_BEAT, BEAT]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 1.0}}
