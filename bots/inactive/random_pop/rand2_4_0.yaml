description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.98}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: ngram, space: {ORDER: 3, CTX: JOINT, OF: OPP, DECAY: 0.9}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.9}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 11, SAMPLE: 1}, rotations: [BEAT_BEAT, COPY]}
        - {bot: ngram, space: {ORDER: 2, CTX: JOINT, OF: MY, DECAY: 1.0}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 15, CTX: OPP, OF: MY}, rotations: [BEAT, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
