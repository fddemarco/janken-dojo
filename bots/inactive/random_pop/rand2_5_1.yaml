description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: backoff, space: {MAX_ORDER: 3, CTX: MY, OF: MY}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.98}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: ngram, space: {ORDER: 2, CTX: OPP, OF: OPP, DECAY: 0.98}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.9}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 0, DECAY: 0.8}, rotations: [BEAT, BEAT_BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 1.0}}
