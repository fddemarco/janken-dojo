description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: period, space: {OF: MY, MAX_PERIOD: 6, DECAY: 0.85}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: ngram, space: {ORDER: 2, CTX: MY, OF: MY, DECAY: 0.95}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: frequency, space: {OF: MY, DECAY: 0.95}, rotations: [BEAT_BEAT, COPY]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.95}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: backoff, space: {MAX_ORDER: 3, CTX: MY, OF: OPP}, rotations: [COPY, BEAT, BEAT_BEAT]}
      scorer: {DecayedNet: {decay: 0.99}}
      selector: {Greedy: {ties: TIES_RANDOM}}
