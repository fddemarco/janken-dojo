description: |
  Smartbot plus stalling, i.e. pure random play on two triggers.

  Random play makes any opponent's expected score exactly 0, so stalling can't be
  exploited. Drawdown: when the last DD_WINDOW rounds net -DD_TRIGGER or worse
  (we are being read), stall for STALL_ROUNDS rounds. Lead lock: when the lead is
  safe by LOCK_Z standard deviations of a random walk over the rounds left, stall.
defaults:
  ARM_DECAY: 0.95
  TABLE_DECAY: 0.9
  MAX_MATCH: 12
  DD_WINDOW: 20
  DD_TRIGGER: 5
  STALL_ROUNDS: 15
  LOCK_Z: 4.0
blueprint:
  core:
    bot: smartbot_v1
    space: {ARM_DECAY: $ARM_DECAY, TABLE_DECAY: $TABLE_DECAY, MAX_MATCH: $MAX_MATCH}
  overlays:
    - Stall:
        dd_window: $DD_WINDOW
        dd_trigger: $DD_TRIGGER
        stall_rounds: $STALL_ROUNDS
        lock_z: $LOCK_Z
