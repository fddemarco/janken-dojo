description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: geometry, space: {ALPHA: 0.1, MAX_LEN: 22, SAMPLE: 1}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 12, SAMPLE: 1}, rotations: [BEAT, COPY]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 12, DECAY: 0.98}, rotations: [BEAT_BEAT, COPY, BEAT]}
      scorer: {Dirichlet: {decay: 0.85}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
