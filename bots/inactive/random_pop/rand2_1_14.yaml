description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: longest_match, space: {MAX_LEN: 8, CTX: JOINT, OF: OPP}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 13, CTX: MY, OF: OPP}, rotations: [BEAT_BEAT, COPY]}
        - {bot: frequency, space: {OF: OPP, DECAY: 1.0}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.98}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.9}, rotations: [BEAT, BEAT_BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
