description: |
  gate_main_first_v3 (the V3 core with the computed replay estimate) with 5% random moves, less predictable to the bots that read us; judged on the field-twin bench.
defaults:
  EDGE: 0.0
  GATE_DECAY: 1.0
  WARMUP: 10
blueprint:
  guards: [{Noise: {p: 0.05}}]
  core:
    Gate:
      main: {bot: smartbot_sims_v2}
      experts:
        - {bot: smartbot_sims_v2, side: OPP, estimate: NORMAL, rotations: [BEAT]}
      rule: MAIN_FIRST
      edge: $EDGE
      decay: $GATE_DECAY
      warmup: $WARMUP
