description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: period, space: {OF: MY, MAX_PERIOD: 14, DECAY: 0.9}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 1.0}, rotations: [COPY, BEAT_BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.9}, rotations: [COPY, BEAT]}
        - {bot: geometry, space: {ALPHA: 0.1, MAX_LEN: 8, SAMPLE: 1}, rotations: [BEAT_BEAT, COPY]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 14, DECAY: 0.98}, rotations: [COPY, BEAT]}
        - {bot: period, space: {OF: OPP, MAX_PERIOD: 16, DECAY: 0.85}, rotations: [BEAT_BEAT, COPY, BEAT]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
