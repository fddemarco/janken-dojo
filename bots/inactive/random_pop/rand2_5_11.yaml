description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: frequency, space: {OF: MY, DECAY: 0.95}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: second_match, space: {MAX_LEN: 10, CTX: MY, OF: OPP}, rotations: [BEAT, COPY]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.85}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: second_match, space: {MAX_LEN: 17, CTX: OPP, OF: MY}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 8, CTX: OPP, OF: MY}, rotations: [BEAT, COPY, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.85}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 1.0}}
