description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  guards: [{Noise: {p: 0.03}}]
  core:
    Bandit:
      predictors:
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 28, SAMPLE: 1}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 16, CTX: MY, OF: OPP}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 1.0}, rotations: [COPY, BEAT_BEAT, BEAT]}
      scorer: {DecayedNet: {decay: 0.95}}
      selector: {Greedy: {ties: TIES_RANDOM}}
