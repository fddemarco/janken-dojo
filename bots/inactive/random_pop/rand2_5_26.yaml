description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 10, SAMPLE: 1}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 15, CTX: OPP, OF: OPP}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 1.0}, rotations: [BEAT_BEAT, BEAT]}
      scorer: {Dirichlet: {decay: 0.99}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 1.0}}
