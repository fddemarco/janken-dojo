description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: second_match, space: {MAX_LEN: 15, CTX: OPP, OF: OPP}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 1, DECAY: 0.8}, rotations: [BEAT_BEAT, COPY]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.85}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 21, SAMPLE: 1}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.98}, rotations: [COPY, BEAT]}
      scorer: {DecayedNet: {decay: 0.8}}
      selector: {Greedy: {ties: TIES_RANDOM}}
