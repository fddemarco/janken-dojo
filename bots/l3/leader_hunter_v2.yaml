description: |
  smartbot, with replays of three other metabots as gated experts (LEADER) (NORMAL replays).
  As leader_hunter_v1, its replays naming their move by estimate NORMAL instead of 256 Thompson draws: the same likely move, computed, about 10x cheaper (idea #50).
defaults:
  EDGE: 0.05
  WARMUP: 20
blueprint:
  core:
    Gate:
      main: {bot: smartbot_v1}
      experts:
        - {bot: iocaine_lite_v1, side: OPP, rotations: [BEAT]}
        - {bot: rps4_lite_v1, side: OPP, rotations: [BEAT]}
        - {bot: smartbot_fast_v1, side: OPP, estimate: NORMAL, rotations: [BEAT]}
      rule: LEADER
      edge: $EDGE
      warmup: $WARMUP
