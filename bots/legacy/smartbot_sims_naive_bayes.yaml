description: |
  smartbot_sims plus a TPI-lite naive-Bayes combiner arm (idea #2).

  Testing Please Ignore's design (rps_kaggle §6) as one extra signal: NaiveBayes
  learns, per signal, how its symbol relates to the opponent's real move, multiplies
  that evidence from all 28 other signals (the metabot's 18 predictors and the 10
  sims, replays included) into one posterior, and names the move with the best
  expected score. Its three rotations join the other arms under the same Dirichlet
  scores and Thompson sampling, so it plays only when it earns it.
defaults:
  ARM_DECAY: 0.95
  TABLE_DECAY: 0.9
  MAX_MATCH: 12
  BAYES_DECAY: 0.95
blueprint:
  signals:
    - metabot_signals: {table_decay: $TABLE_DECAY, max_match: $MAX_MATCH}
    - sims: {n: 10}
    - NaiveBayes: {decay: $BAYES_DECAY}
  rotations: ALL_ROTATIONS
  scorer: {Dirichlet: {decay: $ARM_DECAY}}
  random_arm: RA_SCORED
  selector: Thompson
