description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: second_match, space: {MAX_LEN: 10, CTX: OPP, OF: OPP}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 5, CTX: MY, OF: MY}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: frequency, space: {OF: OPP, DECAY: 1.0}, rotations: [BEAT, BEAT_BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
