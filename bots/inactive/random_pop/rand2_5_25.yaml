description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: longest_match, space: {MAX_LEN: 4, CTX: MY, OF: MY}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: frequency, space: {OF: MY, DECAY: 0.85}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: geometry, space: {ALPHA: 0.02, MAX_LEN: 18, SAMPLE: 1}, rotations: [BEAT_BEAT, BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.95}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
