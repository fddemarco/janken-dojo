description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: ngram, space: {ORDER: 1, CTX: OPP, OF: OPP, DECAY: 1.0}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.9}, rotations: [COPY, BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 15, CTX: OPP, OF: MY}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.95}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: frequency, space: {OF: OPP, DECAY: 0.85}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 0, DECAY: 1.0}, rotations: [COPY, BEAT]}
      scorer: {DecayedNet: {decay: 0.95}}
      selector: {Greedy: {ties: TIES_RANDOM}}
