# The test suite's own configuration (tests/conftest.py points janken at it, with
# no local overrides), so editing janken.toml or janken.local.toml never changes a
# test. Add a key here when the schema (janken/settings.py) gains one.
#
# The janken lab's configuration: every default, one table per domain concept.
#
# Read with `janken config show [TABLE]` / `janken config get KEY`, and change with
# `janken config set KEY VALUE` (this file) or `janken config set --local KEY VALUE`
# (janken.local.toml, gitignored, for one machine). Every key is required; command-line
# flags override these values for one command (docs/configuration.md).

[engine]
# Compile bots and the referee with numba; false runs them as plain Python (the test
# suite does, via $JANKEN_JIT). $JANKEN_JIT overrides.
jit = true
# Commands that keep numba's compiled code on disk (the compute-intensive ones); the
# rest compile in memory. --cache / --no-cache or $JANKEN_NUMBA_CACHE override.
cache_commands = ["evaluate", "tune", "tournament", "bot check", "lab experiment", "lab resume", "lab match", "lab calibrate", "lab study run", "lab dataset add", "lab predict", "lab predict-tune", "species census", "species compare", "species classify"]

[output]
# Progress bars on long commands: "auto" (only on an interactive terminal), "on" or
# "off". $JANKEN_PROGRESS overrides.
progress = "auto"
# How results print: "text" (markdown tables) or "json" (for scripts and agents).
format = "text"
# Print only what a command must: the ids it creates, and errors.
quiet = false

[workspace]
# Paths, relative to the project root.
# Never the lab's own: no test reads the real runs, bots, spaces or notebook. A test
# that plays or stores passes its own temporary --workspace; nothing is ever here.
dir = "tests/data/no-workspace"
notebook = "tests/data/research"
bots_dir = "tests/data/bots"
spaces_dir = "tests/data/spaces"

[execution]
# Threads playing matches; 0 uses every core.
workers = 0

[match]
# Rounds per match: 200 is the tournament standard.
rounds = 200

[pool]
# Each round robin draws this many random bots from the bots dir (candidates excluded).
size = 20
allow_small = false
# Draw the pure Oracles (research-only stand-ins for an expensive bot, janken/mocks.py)
# instead of the bots they mock. Set it locally while experimenting:
# `janken config set --local pool.mocks true`. Oracles never enter a tournament.
mocks = false

[calibration]
# Matches a bot plays vs each opponent when it is calibrated for its Oracle.
seeds = 16

[effort]
# Named evidence budgets. --effort picks one; explicit flags (--round-robins, --trials,
# ...) override its values.
default = "standard"

[effort.quick]
# Smoke-sized: checks that things run, proves nothing.
round_robins = 2
tune_round_robins = 2
trials = 10
validate_top = 1
validate_round_robins = 2
predict_trials = 10

[effort.standard]
# 10 round robins give each candidate 200 matches vs the pool: a score CI of ~+/-6 pts.
round_robins = 10
tune_round_robins = 5
trials = 100
validate_top = 5
validate_round_robins = 10
predict_trials = 100

[effort.thorough]
# For small effects: 40 round robins give a score CI of ~+/-3 pts.
round_robins = 40
tune_round_robins = 10
trials = 300
validate_top = 5
validate_round_robins = 40
predict_trials = 300

[evaluation]
# "full": every pair of pool and candidates plays; "candidates": only the matches
# with a candidate (faster; ratings then rest on fewer matches).
mode = "full"
# -1 draws a fresh seed (recorded with the run); any other value reproduces a run.
seed = -1

[tuning]
# "tpe", "grid" (each param's grid list) or "random" (a baseline).
sampler = "tpe"
# Stop trials clearly below the median early.
prune = true
# The pools and match seeds every trial of a study plays (common random numbers).
seed = 0
# The sampler's seed; -1 leaves it unseeded (do so for parallel workers).
sampler_seed = -1
# Trials between re-exports of experiments/tuning/<study>/trials.parquet.
export_every = 10
# Stop starting trials after this many seconds; 0 sets no limit.
timeout_s = 0.0

[space]
# A scaffolded space ranges each default from default / spread to default * spread,
# with grid_points grid values; weight is its share of a multi-bot study's objective.
spread = 2.0
grid_points = 4
weight = 1.0

[tournament]
matches = 1
# A balanced random schedule of about this many games per bot; 0 plays a round robin.
games = 0
# List only bots finishing with this title: novice, cm, master, im, gm or all.
league = "all"
# Matches per batch (one progress step).
batch_matches = 1000
# -1 draws a fresh seed.
seed = -1

[dataset]
# The move dataset, in the workspace: append-only, one row per match and per round.
file = "dataset.duckdb"
# A match whose stored holdout key is below this is in the test split, forever.
holdout = 0.2
# What predictor tuning maximises: accuracy, macro_f1, kappa or edge.
metric = "accuracy"
# A predictor-tuning trial is scored in this many steps, so the pruner can stop it.
chunks = 4
# `dataset add` commits this many matches per transaction.
batch_matches = 1000
# Matches per pair a `dataset add` plays.
matches = 1
# A batch's seed; -1 draws a fresh one (stored with every match).
seed = -1
# The split predictors are scored on, and the one predictor tuning trains on.
split = "test"
tune_split = "train"

[runs]
# Experiment runs (validation runs included) and validation results, in the workspace.
# A process that finds the file locked retries for lock_timeout_s seconds.
file = "runs.duckdb"
lock_timeout_s = 30.0

[query]
# `janken lab query`: the database read ("runs" or "dataset"), and the rows printed.
db = "runs"
limit = 50

[status]
# What `janken status` lists.
recent_runs = 8
ideas = 8
leaderboard = 10

[export]
# `janken bot export`: where the submission scripts go (a folder per exported bot),
# and the longest match they can play (the tournament plays 200 rounds).
dir = "exports"
max_rounds = 1000
# The tournament's screening of a submission: the only modules it may import, and
# the builtins it may not name (file access, dynamic code, introspection).
allowed_modules = ["abc", "array", "bisect", "collections", "copy", "dataclasses", "datetime", "decimal", "enum", "fractions", "functools", "heapq", "itertools", "json", "math", "numbers", "random", "re", "statistics", "string", "time", "typing"]
banned_names = ["open", "eval", "exec", "compile", "__import__", "input", "breakpoint", "globals", "locals", "vars", "getattr", "setattr", "delattr", "exit", "quit", "help"]

[fleet]
# `janken bot fleet`: a fleet scaffolded on a bot. Its champion file goes to `dir`
# (under the bots dir, so it can name its base bot);
# it has `size` bots (the champion and its supports) and a random handshake of
# `handshake_length` moves; `export` writes its scripts at once.
dir = "inactive/fleets"
size = 5
handshake_length = 8
vigilant = true
export = true

[species]
# How `janken species classify` decides what a kept bot is. Alike: its core agrees with
# a species' current version on at least `agreement` of the predicted moves (dataset
# `split`) AND their per-opponent scores in a paired run of `round_robins` correlate at
# least `profile_correlation`. Better: no matchup's 95% CI below 0, and one above 0 at
# the Bonferroni level alpha / matchups (matchups with >= min_matchup_matches matches),
# or as good and speed_factor times faster.
agreement = 0.8
profile_correlation = 0.7
round_robins = 40
min_matchup_matches = 10
alpha = 0.05
split = "test"
# Matches of the split the cores replay, evenly spread over it. The bots that replay
# smartbot_sims (anti_smartbot_sims, the gates) cost ~1s a match each; 30 matches give
# ~15k predictions per pair, plenty for an agreement rate.
matches = 30
# A challenger as good as the incumbent (worse on no matchup, better on none) still
# replaces it when it plays speed_factor times faster: each bot plays speed_matches
# self-play matches, timed speed_repeats times (the fastest repeat counts).
speed_factor = 2.0
speed_matches = 8
speed_repeats = 3
# Retired versions and variants go here, relative to the bots dir (never in a pool).
legacy_dir = "inactive/legacy"
# Computed cores are kept here, in the workspace, named after a hash of the bot (and
# the bots it names), the replay code and the histories: a census, compare or
# classify replays only the bots that changed (janken/lab/cores.py).
cores_dir = "cores"

[telemetry]
# Timing spans: one JSON line per coarse operation (a command, compiling, playing, a
# round robin, a trial), in the workspace; read with `janken lab profile spans`.
# $JANKEN_SPANS overrides.
spans = true
file = "logs/spans.jsonl"
max_mb = 20
# A command whose last run took this many times its median is flagged slow.
slow_factor = 1.5

[profile]
# `janken lab profile`: profiles and benchmarks go to this folder of the workspace.
dir = "profiles"
interval_s = 0.001
top = 15
# Profile compiled code; false runs the command as plain Python, to see inside kernels.
jit = true
# Run the command once, unmeasured, before profiling or timing it: numba's on-disk
# cache is then warm (for engine.cache_commands), as in everyday use.
warmup = true
# The optimization budget. A hotspot under min_share of the wall time isn't worth it
# (removing it all gains < 11%). Otherwise a session is worth it when cutting
# expected_cut of the hotspot, on every use of the command projected over
# horizon_days (its rate over the last window_days of spans), saves at least the
# session's cost, session_minutes.
min_share = 0.10
expected_cut = 0.5
window_days = 30
horizon_days = 90
session_minutes = 60
# A session tries at most max_attempts changes, and keeps one only if it cuts the
# fastest of `repeats` timed runs by at least min_gain.
max_attempts = 3
min_gain = 0.05
repeats = 3
# A command is profiled again only after cooldown_days, unless its spans flag it slow.
cooldown_days = 7

[gauntlet]
# `janken lab gauntlet`: a candidate vs every opponent of a list, each on its own
# (variations of the field's bots included). Logs go to this folder of the workspace.
dir = "gauntlet"
# Matches per opponent, and the share of rounds won a candidate must reach vs each.
seeds = 10
threshold = 0.36
batch = 256
# `variations`: per_bot variants of each field bot, drawn from its space file (at
# most `draws` Latin hypercubes), kept only if their moves differ from the
# default's vs the probes in seeded matches of probe_rounds rounds.
per_bot = 10
draws = 4
seed = 0
probe_rounds = 100
variation_probes = ["bots/l2/smartbot_v1.yaml", "bots/l1/frequency_v1.yaml"]
levels = ["l1", "l2", "l3", "l4"]
# Field bots that get no variants: Nash-like by `lab gauntlet nash` (vs simple
# probes; research/gauntlet/nash_check.md) and with no parameters to vary.
exclude = ["nash_v1"]
# `nash`: a bot is Nash-like ("Nash with extra steps") when, vs every probe, its
# rounds won minus lost stay under nash_skew: no simple bot exploits it or is
# exploited by it. The probes: a fixed move, a cycle, a reaction to our last move,
# a frequency counter, a pattern matcher.
nash_probes = ["bots/l1/rock_v1.yaml", "bots/l1/cycler_v1.yaml", "bots/l1/reactionary_v1.yaml", "bots/l1/frequency_v1.yaml", "bots/l1/pattern_memory_v1.yaml"]
nash_seeds = 3
nash_skew = 0.10
