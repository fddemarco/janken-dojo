description: |
  Level-k one level up: the best L4 replayed from both seats, LEADER.

  smartbot_sims_v2's main bandit; gated experts: replay_hunter_wide_v2 and
  level_k_gate_v2 from the opponent's seat (their move, beaten) and from ours (our
  own L4 move, which a bot replaying it would beat: BEAT_BEAT beats that), each
  all three ways, and the shared experts.

  Shared experts: a frequency specialist (the opponent's most frequent move
  beaten, undecayed and decayed 0.97: a biased coin), and counters to the samplers
  (transition_matrix's model at four decays, geometry's at three alphas,
  sampled_markov's likeliest move by its unsampled twin sampled_markov_mode).
  L4s are replayed as their gatekeeper plays (every replay, inner ones included, computes its likely move: estimate NORMAL).
defaults:
  EDGE: 0.0
  GATE_DECAY: 1.0
  WARMUP: 10
blueprint:
  core:
    Gate:
      main: {bot: smartbot_sims_v2}
      experts:
        - {bot: frequency_v1, arms: 2, space: {DECAY: [1.0, 0.97]}}
        - {bot: ngram, arms: 4, side: OPP, space: {ORDER: 1, CTX: OPP, DECAY: [0.6, 0.8, 0.95, 1.0]}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: geometry, arms: 3, side: OPP, space: {ALPHA: [0.02, 0.05, 0.15], MAX_LEN: 20, SAMPLE: 0}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: sampled_markov_mode, side: OPP, estimate: NORMAL, rotations: [BEAT, BEAT_BEAT]}
        - {bot: replay_hunter_wide_v2, side: OPP, estimate: NORMAL, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: level_k_gate_v2, side: OPP, estimate: NORMAL, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: replay_hunter_wide_v2, side: MY, estimate: NORMAL, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: level_k_gate_v2, side: MY, estimate: NORMAL, rotations: [COPY, BEAT, BEAT_BEAT]}
      rule: LEADER
      edge: $EDGE
      decay: $GATE_DECAY
      warmup: $WARMUP
