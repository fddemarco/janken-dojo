description: |
  Beats second_repeat's reply: predicts our own next move by the second-longest earlier repeat (as second_repeat does from its seat) and plays what beats its beat (idea #65).
  A counter of the L1 strong set computed at L1: one signal (SecondMatch of our moves) turned BEAT_BEAT, no replay.
defaults:
  MAX_LEN: 12
blueprint:
  core:
    Heuristic: {signal: {SecondMatch: {max_len: $MAX_LEN, ctx: JOINT, of: MY}}, rotation: BEAT_BEAT}
