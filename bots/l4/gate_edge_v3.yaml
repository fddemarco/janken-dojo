description: |
  The EDGE gatekeeper: smartbot_sims's arms, plus anti_smartbot_sims' replay as a gated expert (idea #30) (NORMAL replays).
  As gate_edge_v2, its replays naming their move by estimate NORMAL instead of 256 Thompson draws: the same likely move, computed, about 10x cheaper (idea #50).
defaults:
  EDGE: 0.06
  GATE_DECAY: 1.0
  WARMUP: 20
blueprint:
  core:
    Gate:
      main: {bot: smartbot_sims_v2}
      experts:
        - {bot: smartbot_sims_v2, side: OPP, estimate: NORMAL, rotations: [BEAT]}
      edge: $EDGE
      decay: $GATE_DECAY
      warmup: $WARMUP
