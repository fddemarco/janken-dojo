description: |
  Predictors x 3 arms, chosen by Thompson sampling (the Kaggle RPS 1st-place recipe).

  18 cheap opponent-move predictors (frequency, n-grams on three histories,
  longest match, relative-move models) each become three arms: beat the
  prediction, beat the move that beats it, or play it (so we also beat opponents
  who model us, and those who model our model). A bandit Thompson-samples a
  decayed win/tie/loss Dirichlet per arm, and a random arm is the safety net.
  The core is presets.metabot() in janken/kit/presets.py.
defaults:
  ARM_DECAY: 0.95
  TABLE_DECAY: 0.9
  MAX_MATCH: 12
blueprint:
  core:
    metabot:
      arm_decay: $ARM_DECAY
      table_decay: $TABLE_DECAY
      max_match: $MAX_MATCH
      selector: Thompson
