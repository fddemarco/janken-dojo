description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: period, space: {OF: MY, MAX_PERIOD: 5, DECAY: 0.98}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 1, DECAY: 0.95}, rotations: [COPY, BEAT]}
        - {bot: score_state, space: {OF: OPP, DECAY: 0.8}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: ngram, space: {ORDER: 3, CTX: JOINT, OF: OPP, DECAY: 1.0}, rotations: [BEAT, BEAT_BEAT, COPY]}
      scorer: {DecayedNet: {decay: 0.95}}
      selector: {Greedy: {ties: TIES_RANDOM}}
