description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: frequency, space: {OF: OPP, DECAY: 0.9}, rotations: [COPY, BEAT]}
