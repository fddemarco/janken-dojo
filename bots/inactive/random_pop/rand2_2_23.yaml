description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: score_state, space: {OF: OPP, DECAY: 0.95}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 14, CTX: JOINT, OF: OPP}, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 1, DECAY: 0.98}, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: ngram, space: {ORDER: 3, CTX: OPP, OF: OPP, DECAY: 1.0}, rotations: [COPY, BEAT_BEAT]}
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 16, SAMPLE: 1}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: ctw, space: {DEPTH: 1, CTX: OPP, OF: MY, DECAY: 1.0}, rotations: [BEAT, COPY, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.9}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 3.0}}
