description: |
  gate_main_first_v3 (the V3 core with the computed replay estimate) over smartbot_sims_lean_c (keeping only 3 models of us (iocaine_lite, smartbot_v1, pattern_memory)), judged on the field-twin bench.
defaults:
  EDGE: 0.0
  GATE_DECAY: 1.0
  WARMUP: 10
blueprint:
  core:
    Gate:
      main: {bot: smartbot_sims_lean_c}
      experts:
        - {bot: smartbot_sims_lean_c, side: OPP, estimate: NORMAL, rotations: [BEAT]}
      rule: MAIN_FIRST
      edge: $EDGE
      decay: $GATE_DECAY
      warmup: $WARMUP
