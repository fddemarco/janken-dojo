description: |
  smartbot_sims plus a replay of smartbot_sims itself (idea #13).

  The replay runs smartbot_sims's whole core from the opponent's side, at its
  constants (0.95, 0.9, 12), including its own replays of smartbot and
  smartbot_fast (a nested replay, which sees the history swapped back). Its symbol
  is the arm with the best posterior mean, smartbot_sims's most likely move.
defaults:
  ARM_DECAY: 0.95
  TABLE_DECAY: 0.9
  MAX_MATCH: 12
blueprint:
  signals:
    - metabot_signals: {table_decay: $TABLE_DECAY, max_match: $MAX_MATCH}
    - sims: {n: 10}
    - Replay:
        ensemble:
          smartbot_sims: {n: 10, arm_decay: 0.95, table_decay: 0.9, max_match: 12}
  rotations: ALL_ROTATIONS
  scorer: {Dirichlet: {decay: $ARM_DECAY}}
  random_arm: RA_SCORED
  selector: Thompson
