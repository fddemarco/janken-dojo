description: |
  Smartbot plus 10 "model of us" sims, replays of the Thompson metabots included.

  The sims (presets.SIMS in janken/kit/presets.py) replay the zoo bots that model
  us (word2janken, pattern_memory, markov2_joint, iocaine_lite, transition_matrix,
  rps4_lite, word2janken_scoreboard, geometry) from the opponent's side, and each
  becomes three arms like every other predictor. The last two are replays
  of smartbot's own machinery from the opponent's side (its 18 of smartbot's own machinery from the opponent's side (its 18
  predictors and 54 arm scores, fed the swapped history): at smartbot's constants
  (0.95, 0.9, 12) and at smartbot_fast's (0.6, 0.6, 8). Each predicts the move of
  the arm with the best posterior mean (w - l) / (w + t + l + 3); the real bot
  samples its arm, so this is its most likely move, not a certainty.
defaults:
  ARM_DECAY: 0.95
  TABLE_DECAY: 0.9
  MAX_MATCH: 12
blueprint:
  core:
    smartbot_sims:
      n: 10
      arm_decay: $ARM_DECAY
      table_decay: $TABLE_DECAY
      max_match: $MAX_MATCH
      selector: Thompson
