description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: longest_match, space: {MAX_LEN: 6, CTX: OPP, OF: MY}, rotations: [BEAT_BEAT, COPY, BEAT]}
        - {bot: ngram, space: {ORDER: 3, CTX: JOINT, OF: OPP, DECAY: 0.9}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 1, DECAY: 0.9}, rotations: [COPY, BEAT_BEAT, BEAT]}
      scorer: {Dirichlet: {decay: 0.9}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 2.0}}
