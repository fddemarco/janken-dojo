description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: geometry, space: {ALPHA: 0.05, MAX_LEN: 27, SAMPLE: 1}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 12, CTX: MY, OF: MY}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: second_match, space: {MAX_LEN: 4, CTX: OPP, OF: MY}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: ngram, space: {ORDER: 2, CTX: JOINT, OF: OPP, DECAY: 0.85}, rotations: [BEAT_BEAT, BEAT]}
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 0, DECAY: 0.9}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 15, CTX: OPP, OF: OPP}, rotations: [COPY, BEAT]}
      scorer: {DecayedNet: {decay: 0.8}}
      selector: {Greedy: {ties: TIES_RANDOM}}
