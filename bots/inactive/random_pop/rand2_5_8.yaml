description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: relative, space: {REF: MY, BY_OUTCOME: 0, DECAY: 0.9}, rotations: [BEAT_BEAT, BEAT, COPY]}
        - {bot: score_state, space: {OF: MY, DECAY: 0.85}, rotations: [COPY, BEAT_BEAT]}
        - {bot: period, space: {OF: MY, MAX_PERIOD: 5, DECAY: 1.0}, rotations: [COPY, BEAT_BEAT]}
        - {bot: period, space: {OF: MY, MAX_PERIOD: 12, DECAY: 0.98}, rotations: [COPY, BEAT_BEAT, BEAT]}
        - {bot: ngram, space: {ORDER: 1, CTX: MY, OF: OPP, DECAY: 0.98}, rotations: [BEAT, BEAT_BEAT]}
      scorer: {Dirichlet: {decay: 0.9}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 1.0}}
