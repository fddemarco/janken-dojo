description: |
  Only the L4 gatekeepers replayed, with few gated arms, LEADER.

  smartbot_sims_v2's main bandit; gated experts: smartbot_sims_v2 from both seats,
  the four L4 gatekeepers from their seat (all three ways) and the shared experts:
  few arms, so the gate follows a real lead rather than the luckiest of many
  near-chance records.

  Shared experts: a frequency specialist (the opponent's most frequent move
  beaten, undecayed and decayed 0.97: a biased coin), and counters to the samplers
  (transition_matrix's model at four decays, geometry's at three alphas,
  sampled_markov's likeliest move by its unsampled twin sampled_markov_mode).
  L4s are replayed as their gatekeeper plays (inner replays at 32 draws).
defaults:
  EDGE: 0.03
  GATE_DECAY: 1.0
  WARMUP: 10
blueprint:
  core:
    Gate:
      main: {bot: smartbot_sims_v2}
      experts:
        - {bot: frequency_v1, arms: 2, space: {DECAY: [1.0, 0.97]}}
        - {bot: ngram, arms: 4, side: OPP, space: {ORDER: 1, CTX: OPP, DECAY: [0.6, 0.8, 0.95, 1.0]}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: geometry, arms: 3, side: OPP, space: {ALPHA: [0.02, 0.05, 0.15], MAX_LEN: 20, SAMPLE: 0}, rotations: [BEAT, BEAT_BEAT]}
        - {bot: sampled_markov_mode, side: OPP, draws: 64, rotations: [BEAT, BEAT_BEAT]}
        - {bot: smartbot_sims_v2, side: OPP, draws: 64, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: smartbot_sims_v2, side: MY, draws: 64, rotations: [COPY, BEAT, BEAT_BEAT]}
        - {bot: replay_hunter_wide_v1, side: OPP, draws: 64, inner_draws: 32, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: replay_hunter_gate_v1, side: OPP, draws: 64, inner_draws: 32, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: level_k_gate_v1, side: OPP, draws: 64, inner_draws: 32, rotations: [BEAT, BEAT_BEAT, COPY]}
        - {bot: double_bluff_gate_v1, side: OPP, draws: 64, inner_draws: 32, rotations: [BEAT, BEAT_BEAT, COPY]}
      rule: LEADER
      edge: $EDGE
      decay: $GATE_DECAY
      warmup: $WARMUP
