description: |
  Random architecture (research only, never in the field): an unknown opponent sampled from the kit's grammar.
defaults: {}
blueprint:
  core:
    Bandit:
      predictors:
        - {bot: rarest, space: {OF: MY, DECAY: 0.9}, rotations: [COPY, BEAT_BEAT]}
        - {bot: ngram, space: {ORDER: 1, CTX: OPP, OF: MY, DECAY: 0.85}, rotations: [BEAT_BEAT, COPY]}
        - {bot: relative, space: {REF: OPP, BY_OUTCOME: 0, DECAY: 0.95}, rotations: [BEAT, COPY, BEAT_BEAT]}
        - {bot: longest_match, space: {MAX_LEN: 17, CTX: JOINT, OF: OPP}, rotations: [BEAT, BEAT_BEAT, COPY]}
      scorer: {Dirichlet: {decay: 0.85}}
      random_arm: RA_SCORED
      selector: {Thompson: {sharp: 1.0}}
